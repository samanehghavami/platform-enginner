name: WPBuilder CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =========================
  # CI - Python
  # =========================

  test:
    name: Test Python CLI
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Python
        run: |
          which python3.12
          python3.12 --version

      - name: Create virtual environment
        run: |
          python3 -m venv venv

      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Test Python CLI
        run: |
          source venv/bin/activate
          python -m pytest


  # =========================
  # CI - Helm
  # =========================

  helm-test:
    name: Validate Helm Chart
    runs-on: self-hosted
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Helm version
        run: helm version

      - name: Helm lint
        run: |
          helm lint ./charts/wordpress-generic

      - name: Helm template
        run: |
          helm template wordpress \
            ./charts/wordpress-generic


  # =========================
  # CD - Kubernetes
  # =========================

  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted

    needs:
      - test
      - helm-test

    env:
      KUBECONFIG: /home/github-runner/.kube/config

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Kubernetes access
        run: |
          kubectl auth can-i create deployments -n wpbuilder
          kubectl auth can-i create ingresses -n wpbuilder

      - name: Deploy sites
        run: |
          for values in sites/*/values.yaml
          do

            site=$(basename $(dirname "$values"))

            echo "================================"
            echo "Deploying: $site"
            echo "Values: $values"
            echo "================================"

            helm upgrade --install "$site" \
              ./charts/wordpress-generic \
              -f "$values" \
              --namespace wpbuilder \
              --create-namespace

          done

      - name: Show releases
        run: |
          helm list -n wpbuilder

      - name: Show pods
        run: |
          kubectl get pods -n wpbuilder

      - name: Show services
        run: |
          kubectl get services -n wpbuilder

      - name: Show ingress
        run: |
          kubectl get ingress -n wpbuilder