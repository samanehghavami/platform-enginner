{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:

  name: {{ .Release.Name }}-wordpress

  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:

  ingressClassName: {{ .Values.ingress.className }}

  rules:

    - host: {{ .Values.site.domain }}

      http:

        paths:

          - path: /
            pathType: Prefix

            backend:

              service:
                name: {{ .Release.Name }}-wordpress

                port:
                  number: 80

{{- end }}